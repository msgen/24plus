<div class="container">
  <form action="/add-image" method="POST" id="add-image-frm">
      <div class="form-group">
        <label for="selectClients">Selectati clientul</label>
        <select class="form-control" id="selectClients">
          {% for client in clients %}
            <option value="{{ client.id }}">{{ client.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
          <label for="clientImage">Adaugati imagine</label>
          <input type="file" class="form-control-file" id="clientImage">
        </div>
    </form>
</div>
