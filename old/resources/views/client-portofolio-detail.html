{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block pluginsCss %}
{% endblock %}

{% block pluginsJs %}
{% endblock %}

{% block content %}
<div class="container">
    <div class="section-title justify-content-center mb-4 mt-5 wow fadeInUp">
        <span class="shape shape-left bg-info"></span>
        <h2 class="text-danger">{{client}}</h2>
        <span class="shape shape-right bg-info"></span>
    </div>
    <div id="gallery-grid">
        <div class="row grid wow fadeInUp">
            {% for item in portofolio %}
            <div class="col-md-4 col-lg-3 col-xs-12 element-item">
                <div class="media media-hoverable justify-content-center">
                    <div class="position-relative w-100">
                        <img class="media-img w-100"
                            data-src="/assets/img/{{item.image.smallUrl}}"
                            src="/assets/img/{{item.image.smallUrl}}"
                            alt="gallery-img">
                        <a class="media-img-overlay" data-fancybox="gallery"
                            href="/assets/img/{{item.image.bigUrl}}">
                            <div class="btn btn-squre">
                                <i class="fa fa-search-plus"></i>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
