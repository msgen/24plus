<div class="container" id="contact">
  <div class="row wow fadeInUp">
    <div class="col-sm-6 col-xs-12">
      <div class="section-title align-items-baseline mb-4">
        <h2 class="text-danger px-0 mb-0">Contact</h2>
      </div>
      <ul class="list-unstyled">
        <li class="media align-items-center mb-3">
          <div class="icon-rounded-circle-small bg-warning mr-2">
            <i class="fa fa-map-marker text-white"></i>
          </div>
          <div class="media-body">
            <p class="mb-0">
              Str. Gib Mihaescu nr. 14, Rm. Valcea, Romania
            </p>
          </div>
        </li>
        <li class="media align-items-center mb-3">
          <div class="icon-rounded-circle-small bg-success mr-2">
            <i class="fa fa-envelope text-white"></i>
          </div>
          <div class="media-body">
            <p class="mb-0"><a class="text-color"
                href="mailto:contact@24plus.ro">contact@24plus.ro</a></p>
          </div>
        </li>
        <li class="media align-items-center mb-3">
          <div class="icon-rounded-circle-small bg-info mr-2">
            <i class="fa fa-phone text-white"></i>
          </div>
          <div class="media-body">
            <p class="mb-0"><a class="text-color" href="tel:0745537715">0745 537 715</a></p>
          </div>
        </li>
      </ul>
    </div>
    <div class="col-sm-6 col-xs-12">
      <form id="contact-frm" onsubmit="return false" >
        <div class="form-group form-group-icon">
          <i class="fa fa-user"></i>
          <input type="text" name="nume" class="form-control border-warning"
            placeholder="Nume" required>
        </div>
        <div class="form-group form-group-icon">
          <i class="fa fa-envelope"></i>
          <input type="email" name="email" class="form-control border-success"
            placeholder="Email" required>
        </div>
        <div class="form-group form-group-icon">
          <i class="fa fa-comments"></i>
          <textarea name="mesaj" class="form-control border-info" placeholder="Mesaj"
            rows="6"></textarea>
        </div>
        <button type="submit" class="btn btn-danger float-right text-uppercase">
          Trimite
        </button>
      </form>
    </div>
  </div>
</div>
