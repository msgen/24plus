<div class="container">
  <div class="section-title justify-content-center mb-4 mb-md-8 wow fadeInUp">
    <span class="shape shape-left bg-info"></span>
    <h2 class="text-danger">Clienti</h2>
    <span class="shape shape-right bg-info"></span>
  </div>

  <div class="row wow fadeInUp">
      {% for client in clients %}
      <div class="col-md-3 col-xs-12">
        <div class="card position-relative">
          <a href="/portofoliu/{{client.name}}/{{client.id}}">
            <img class="card-img-top" src="assets/img/{{client.image}}"
              alt="{{client.name}}">
          </a>
          <div class="card-body">
            <h5 class="card-title">{{client.name}}</h5>
          </div>
        </div>
      </div>
      {% endfor %}
  </div>

  <div class="btn-aria text-center mt-4 wow fadeInUp">
      <a href="/clienti" class="btn btn-danger text-uppercase box-shadow">Vezi tot</a>
  </div>
</div>
